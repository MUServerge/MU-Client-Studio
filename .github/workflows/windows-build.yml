name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore MUClientStudio.sln
      - name: Build
        run: dotnet build MUClientStudio.sln -c Release --no-restore
      - name: Publish win-x64
        run: dotnet publish src/MUClientStudio.App/MUClientStudio.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/win-x64
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: MU-Client-Studio-win-x64
          path: artifacts/win-x64/**
          if-no-files-found: error
          retention-days: 14
